name: Docs

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so make.jl can date the data from the last commit to version_map.jl.
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Build the site
        run: julia --color=yes docs/make.jl
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          # Turn Pages on (source: GitHub Actions) the first time this runs.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    # Only publish from main; PRs just check that the build succeeds.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
